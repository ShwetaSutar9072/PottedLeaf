<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logo.png" />
    <title>The Potted Leaf</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please turn on JavaScript to use this site.</noscript>
    <script>
      // If the app fails to start, show the error instead of a blank page.
      function showErr(m) {
        var r = document.getElementById("root");
        if (r && !r.children.length) r.innerHTML = '<div style="padding:24px;font-family:Arial"><h2 style="color:#b3261e">The app could not start</h2><pre style="white-space:pre-wrap;background:#fff;padding:12px">' + String(m).replace(/</g, "&lt;") + '</pre></div>';
      }
      window.addEventListener("error", function (e) { showErr(e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
      window.addEventListener("unhandledrejection", function (e) { showErr(e.reason); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
