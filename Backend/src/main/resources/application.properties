spring.application.name=PlantStore

spring.datasource.url=jdbc:mysql://localhost:3306/plantstore
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=pottedleaf-support
spring.ai.vectorstore.pinecone.namespace=policies

spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.embedding.model=mistral-embed
spring.ai.model.embedding=mistral